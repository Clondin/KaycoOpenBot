name: release / verified candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Build and attest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openbot
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify source policy
        run: bun run supply-chain:check
      - name: Format, lint, and type-check
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
      - name: Prepare test database
        run: bunx drizzle-kit migrate --config=drizzle.config.ts
        working-directory: server
      - name: Test
        run: bun run test:ci
      - name: Build
        run: bun run build
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: kayco-openbot-sbom.spdx.json
          format: spdx-json
          output-file: kayco-openbot-sbom.spdx.json
          path: .
          upload-artifact: false
      - name: Create release bundle and checksum
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git archive --format=tar.gz --prefix="kayco-openbot-${COMMIT_SHA}/" --output="kayco-openbot-${COMMIT_SHA}.tar.gz" "${COMMIT_SHA}"
          sha256sum "kayco-openbot-${COMMIT_SHA}.tar.gz" kayco-openbot-sbom.spdx.json > SHA256SUMS
      - name: Attest release bundle and SBOM
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            kayco-openbot-${{ github.sha }}.tar.gz
            kayco-openbot-sbom.spdx.json
      - name: Upload verified candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          if-no-files-found: error
          name: kayco-openbot-${{ github.sha }}
          path: |
            kayco-openbot-${{ github.sha }}.tar.gz
            kayco-openbot-sbom.spdx.json
            SHA256SUMS

channels:
  - id: general-assistant
    name: General Assistant
    description: Ask for help with everyday work.
    permitted_agents: [general-assistant]
    allowed_groups: [all]
  - id: risk-and-compliance
    name: Risk & Compliance
    description: Investigate policies, transaction monitoring, and control evidence.
    permitted_agents: [knowledge, risk-analyst]
    allowed_groups: [risk, compliance]
  - id: company-knowledge
    name: Company Knowledge
    description: Find authorized answers from company documents.
    permitted_agents: [knowledge]
    allowed_groups: [all]
  - id: research-desk
    name: Research Desk
    description: Build sourced, decision-ready research briefs.
    permitted_agents: [research-analyst, knowledge]
    allowed_groups: [all]
  - id: operations
    name: Operations
    description: Plan, execute, approve, and verify repeatable operational work.
    permitted_agents: [operations-coordinator, knowledge]
    allowed_groups: [operations, all]
  - id: audit-review
    name: Audit Review
    description: Review task histories, approvals, and control evidence without changing source systems.
    permitted_agents: [audit-reviewer, knowledge]
    allowed_groups: [risk, compliance, audit]
